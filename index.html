<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClauseWise AI — Contract Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ===========================
       CSS RESET & VARIABLES
    =========================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #FAF9F7;
      --bg-card: #FFFFFF;
      --bg-card-warm: #FDFCFB;
      --bg-sidebar: #1C1917;
      --bg-sidebar-hover: #292524;
      --bg-sidebar-active: #3730A3;
      --text-primary: #1C1917;
      --text-secondary: #78716C;
      --text-muted: #A8A29E;
      --text-inverse: #FAFAF9;
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --accent-light: #EEF2FF;
      --success: #16A34A;
      --success-bg: #F0FDF4;
      --warning: #D97706;
      --warning-bg: #FFFBEB;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --border: #E8E5E0;
      --border-light: #F0EDE8;
      --shadow: 0 1px 3px rgba(28,25,23,0.06), 0 1px 2px rgba(28,25,23,0.04);
      --shadow-md: 0 4px 12px rgba(28,25,23,0.08), 0 2px 4px rgba(28,25,23,0.04);
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --sidebar-width: 220px;
      --sidebar-collapsed: 60px;
      --insights-width: 280px;
    }

    html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; color: var(--text-primary); background: var(--bg-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font-family: inherit; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    *::-webkit-scrollbar { width: 5px; height: 5px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ===========================
       LAYOUT
    =========================== */
    .app-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-width: 0;
    }

    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ===========================
       SIDEBAR
    =========================== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s ease;
      overflow: hidden;
      z-index: 10;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 14px 14px;
      flex-shrink: 0;
    }
    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .logo-text { overflow: hidden; white-space: nowrap; }
    .logo-name { font-size: 14px; font-weight: 600; color: var(--text-inverse); letter-spacing: -0.01em; }
    .logo-sub { font-size: 11px; color: #A8A29E; }

    .sidebar-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: #A8A29E;
      transition: background 0.15s;
      flex-shrink: 0;
      margin-left: auto;
    }
    .sidebar-toggle-btn:hover { background: var(--bg-sidebar-hover); color: white; }

    .sidebar-nav {
      flex: 1;
      padding: 8px 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      margin: 2px 8px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-decoration: none;
      color: #D6D3D1;
      font-size: 13px;
      font-weight: 500;
    }
    .nav-item:hover { background: var(--bg-sidebar-hover); color: white; }
    .nav-item.active { background: var(--bg-sidebar-active); color: white; }
    .nav-item svg { flex-shrink: 0; }
    .nav-label { overflow: hidden; text-overflow: ellipsis; }

    .sidebar-divider { height: 1px; background: #292524; margin: 8px 0; flex-shrink: 0; }

    .sidebar-user {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text-inverse); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 11px; color: #A8A29E; }
    .settings-btn { color: #A8A29E; display: flex; align-items: center; padding: 4px; border-radius: 4px; transition: color 0.15s; flex-shrink: 0; }
    .settings-btn:hover { color: white; }

    /* ===========================
       INSIGHTS PANEL
    =========================== */
    .insights-panel {
      width: var(--insights-width);
      background: var(--bg-base);
      border-left: 1px solid var(--border);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .insights-title { font-size: 14px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }

    .risk-section {}
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px; }

    .risk-gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .risk-score-num { font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
    .risk-badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .risk-badge.high { background: var(--danger-bg); color: var(--danger); }
    .risk-badge.medium { background: var(--warning-bg); color: var(--warning); }
    .risk-badge.low { background: var(--success-bg); color: var(--success); }

    .contract-details { display: flex; flex-direction: column; gap: 10px; }
    .detail-row {}
    .detail-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
    .detail-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }

    .clause-summary { display: flex; flex-direction: column; gap: 6px; }
    .clause-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-light);
    }
    .clause-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .clause-dot.danger { background: var(--danger); }
    .clause-dot.warning { background: var(--warning); }
    .clause-dot.success { background: var(--success); }
    .clause-dot.indigo { background: var(--accent); }
    .clause-label { font-size: 12px; color: var(--text-secondary); flex: 1; }
    .clause-count {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .clause-count.danger { background: var(--danger-bg); color: var(--danger); }
    .clause-count.warning { background: var(--warning-bg); color: var(--warning); }
    .clause-count.success { background: var(--success-bg); color: var(--success); }
    .clause-count.indigo { background: var(--accent-light); color: var(--accent); }

    /* ===========================
       CONTRACT HEADER BAR
    =========================== */
    .contract-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .contract-icon {
      width: 36px; height: 36px;
      background: #F5F3F0;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .contract-info { flex: 1; min-width: 0; }
    .contract-name {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    .contract-meta { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
    .badge-analysed {
      background: #DCFCE7; color: #15803D;
      font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 20px;
      flex-shrink: 0;
    }

    /* ===========================
       CHAT AREA
    =========================== */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--bg-base);
    }

    .msg-wrap { display: flex; flex-direction: column; gap: 6px; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.ai { align-items: flex-start; }

    .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 75%; }
    .msg-wrap.user .msg-row { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: white;
      flex-shrink: 0; align-self: flex-end;
    }
    .msg-avatar.user { background: var(--accent); }
    .msg-avatar.ai { background: var(--accent); }

    .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
    }
    .msg-wrap.user .msg-bubble { border-radius: 12px 12px 4px 12px; }
    .msg-wrap.ai .msg-bubble { border-radius: 12px 12px 12px 4px; padding: 14px 16px; }

    .msg-time { font-size: 11px; color: var(--text-muted); padding: 0 4px; }
    .msg-wrap.user .msg-time { text-align: right; }

    .msg-text strong { font-weight: 600; color: var(--text-primary); }
    .msg-text p { margin-bottom: 6px; }
    .msg-text p:last-child { margin-bottom: 0; }
    .msg-text ol, .msg-text ul { padding-left: 18px; margin: 6px 0; }
    .msg-text li { margin-bottom: 3px; }

    .evidence-card {
      background: #F8F7FF;
      border: 1px solid #E0E7FF;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 400px;
      margin-left: 38px;
    }
    .evidence-icon { color: var(--accent); flex-shrink: 0; font-size: 14px; font-weight: 700; }
    .evidence-info { flex: 1; min-width: 0; }
    .evidence-source { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .evidence-page { font-size: 11px; color: var(--text-muted); }
    .evidence-link {
      font-size: 12px; color: var(--accent); font-weight: 500;
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap; flex-shrink: 0;
      transition: color 0.15s;
    }
    .evidence-link:hover { color: var(--accent-hover); }

    /* Suggested Questions */
    .suggested-wrap {
      border-top: 1px solid var(--border-light);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-base);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .suggested-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); white-space: nowrap; }
    .suggested-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .suggested-pill {
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .suggested-pill:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    /* Chat Input */
    .chat-input-area {
      padding: 12px 24px 16px;
      background: var(--bg-base);
      flex-shrink: 0;
    }
    .chat-input-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 6px 6px 6px 14px;
      transition: border-color 0.2s;
    }
    .chat-input-container:focus-within { border-color: var(--accent); }
    .attach-btn { color: var(--text-muted); display: flex; padding: 4px; border-radius: 4px; transition: color 0.15s; }
    .attach-btn:hover { color: var(--text-secondary); }
    .chat-input {
      flex: 1; border: none; outline: none; font-size: 14px;
      color: var(--text-primary); background: transparent; resize: none;
      padding: 4px 0; max-height: 120px; line-height: 1.5;
    }
    .chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent); color: white;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.05); }
    .send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; }

    /* ===========================
       PAGE HEADER (generic)
    =========================== */
    .page-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 20px 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header-left {}
    .page-h1 { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
    .page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

    .page-scroll { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* ===========================
       BUTTONS
    =========================== */
    .btn-primary {
      background: var(--accent); color: white;
      border-radius: var(--radius-sm); padding: 8px 16px;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 7px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 7px 14px; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 6px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--text-muted); color: var(--text-primary); }

    /* ===========================
       CARDS
    =========================== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    /* ===========================
       ANALYSIS PAGE
    =========================== */
    .analysis-grid { display: flex; flex-direction: column; gap: 20px; }

    .risk-overview-card {
      display: flex;
      gap: 32px;
      align-items: center;
      flex-wrap: wrap;
    }
    .risk-gauge-side { text-align: center; }
    .risk-mini-stats { display: flex; gap: 20px; flex-wrap: wrap; }
    .mini-stat {
      display: flex; flex-direction: column; gap: 4px;
      padding: 14px 18px; border-radius: var(--radius-sm);
      min-width: 110px;
    }
    .mini-stat.danger { background: var(--danger-bg); border: 1px solid #FECACA; }
    .mini-stat.warning { background: var(--warning-bg); border: 1px solid #FDE68A; }
    .mini-stat.success { background: var(--success-bg); border: 1px solid #BBF7D0; }
    .mini-stat-num { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .mini-stat.danger .mini-stat-num { color: var(--danger); }
    .mini-stat.warning .mini-stat-num { color: var(--warning); }
    .mini-stat.success .mini-stat-num { color: var(--success); }
    .mini-stat-label { font-size: 12px; color: var(--text-secondary); }

    .findings-section { display: flex; flex-direction: column; gap: 10px; }
    .findings-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.01em; }

    .finding-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      overflow: hidden;
    }
    .finding-card-inner {
      display: flex;
      border-left: 3px solid;
      padding: 14px 16px;
    }
    .finding-card.high .finding-card-inner { border-left-color: var(--danger); }
    .finding-card.medium .finding-card-inner { border-left-color: var(--warning); }
    .finding-card-body { flex: 1; }
    .finding-num { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
    .finding-title { font-size: 14px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
    .finding-ref { font-size: 12px; color: var(--text-muted); margin: 2px 0; }
    .finding-excerpt { font-size: 13px; color: var(--text-secondary); font-style: italic; margin: 6px 0 4px; line-height: 1.5; border-left: 2px solid var(--border); padding-left: 10px; }
    .finding-risk { font-size: 13px; color: var(--text-secondary); }
    .finding-risk strong { color: var(--text-primary); font-weight: 600; }

    .missing-card {
      background: var(--warning-bg);
      border: 1px solid #FDE68A;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .missing-title { font-size: 14px; font-weight: 600; color: var(--warning); margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
    .missing-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .missing-list li { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 7px; }
    .missing-list li::before { content: '—'; color: var(--warning); font-weight: 700; }

    .obligations-mini { margin-top: 4px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--bg-base); }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-light); color: var(--text-secondary); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg-base); }

    /* ===========================
       COMPARE PAGE
    =========================== */
    .compare-selectors {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .contract-selector-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 14px;
      font-size: 13px; font-weight: 600; color: var(--text-primary);
    }
    .vs-label { font-size: 12px; font-weight: 700; color: var(--text-muted); padding: 0 2px; }
    .compare-summary-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .compare-sum-item { display: flex; align-items: center; gap: 6px; }
    .compare-sum-dot { width: 8px; height: 8px; border-radius: 50%; }

    .status-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .status-badge.differs { background: var(--warning-bg); color: var(--warning); }
    .status-badge.missing { background: var(--danger-bg); color: var(--danger); }
    .status-badge.match { background: var(--success-bg); color: var(--success); }

    /* ===========================
       OBLIGATIONS PAGE
    =========================== */
    .filter-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .filter-tab {
      padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); border: 1px solid var(--border); background: var(--bg-card);
      transition: all 0.15s;
    }
    .filter-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .filter-tab:hover:not(.active) { border-color: var(--text-muted); color: var(--text-primary); }

    .obligation-status { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .obligation-status.upcoming { background: var(--accent-light); color: var(--accent); }
    .obligation-status.pending { background: var(--warning-bg); color: var(--warning); }

    // ===========================
    // RISK GAUGE SVG
    // ===========================
    function RiskGauge({ score, size = 120 }) {
      const r = 46;
      const cx = 60; const cy = 56;
      const circumference = Math.PI * r;
      const pct = Math.min(score / 100, 1);
      const color = score >= 65 ? '#DC2626' : score >= 40 ? '#D97706' : '#16A34A';
      const label = score >= 65 ? 'High Risk' : score >= 40 ? 'Medium Risk' : 'Low Risk';
      const bgDash = `${circumference} ${circumference}`;
      const fgDash = `${circumference * pct} ${circumference}`;

      return (
        <div className="risk-gauge-wrap">
          <svg width={size} height={size * 0.65} viewBox="0 0 120 80">
            <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} fill="none" stroke="#E8E5E0" strokeWidth="10" strokeLinecap="round"/>
            <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={fgDash} strokeDashoffset="0"/>
          </svg>
          <div className="risk-score-num">{score}<span style={{fontSize:14,fontWeight:400,color:'var(--text-muted)'}}>/100</span></div>
          <span className={`risk-badge ${score >= 65 ? 'high' : score >= 40 ? 'medium' : 'low'}`}>{label}</span>
        </div>
      );
    }

    // ===========================
    // RENDER FORMATTED TEXT
    // ===========================
    function FormattedText({ text }) {
      const lines = text.split('\n');
      const elements = [];
      let listItems = [];
      let inList = false;
      let listType = null;

      const flushList = () => {
        if (listItems.length) {
          const Tag = listType === 'ol' ? 'ol' : 'ul';
          elements.push(<Tag key={`list-${elements.length}`}>{listItems}</Tag>);
          listItems = [];
          inList = false;
          listType = null;
        }
      };

      const renderInline = (str, key) => {
        const parts = str.split(/(\*\*[^*]+\*\*)/g);
        return parts.map((p, i) => {
          if (p.startsWith('**') && p.endsWith('**')) {
            return <strong key={i}>{p.slice(2,-2)}</strong>;
          }
          return p;
        });
      };

      lines.forEach((line, idx) => {
        const olMatch = line.match(/^(\d+)\.\s+(.*)/);
        const ulMatch = line.match(/^[-*]\s+(.*)/);

        if (olMatch) {
          if (!inList || listType !== 'ol') { flushList(); inList = true; listType = 'ol'; }
          listItems.push(<li key={idx}>{renderInline(olMatch[2])}</li>);
        } else if (ulMatch) {
          if (!inList || listType !== 'ul') { flushList(); inList = true; listType = 'ul'; }
          listItems.push(<li key={idx}>{renderInline(ulMatch[1])}</li>);
        } else {
          flushList();
          if (line.trim()) {
            elements.push(<p key={idx}>{renderInline(line)}</p>);
          }
        }
      });
      flushList();

      return <div className="msg-text">{elements}</div>;
    }

    function UploadModal({ onClose }) {

          p += Math.random() * 25;

            setTimeout(() => setUploadState('success'), 200);

      const getResponse = (text) => {
        const lower = text.toLowerCase();
        for (const key of Object.keys(MOCK_RESPONSES)) {
          if (key !== 'default' && lower.includes(key)) return MOCK_RESPONSES[key];
        }
        return MOCK_RESPONSES.default;
      };

      const sendMessage = useCallback((text) => {
        if (!text.trim()) return;
        const userMsg = { id: Date.now(), role:'user', text: text.trim(), time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
        setMessages(prev => [...prev, userMsg]);
        setInputValue('');

          const resp = getResponse(text);
          const aiMsg = {
            id: Date.now()+1, role:'ai',
            text: resp.text,
            source: resp.source, page: resp.page,
            time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})

          setMessages(prev => [...prev, aiMsg]);
        }, 320);
      }, []);

        <div className="page-content">
          <div className="page-header">
            <div className="page-header-left">
              <div className="page-h1">Compare Contracts</div>
              <div className="page-subtitle">Side-by-side clause comparison</div>
            </div>
          </div>
          <div className="page-scroll">
            <div className="compare-selectors">
              <div className="contract-selector-badge">
                <Icons.Document/>
                Vendor Agreement v2.1
              </div>
              <span className="vs-label">vs</span>
              <div className="contract-selector-badge">
                <Icons.Document/>
                Company Template
              </div>
            </div>

            <div className="compare-summary-bar">
              <div className="compare-sum-item">
                <div className="compare-sum-dot" style={{background:'var(--success)'}}/>
                <span style={{color:'var(--success)',fontWeight:600}}>{matches} match{matches!==1?'es':''}</span>
              </div>
              <div style={{width:1,height:14,background:'var(--border)'}}/>
              <div className="compare-sum-item">
                <div className="compare-sum-dot" style={{background:'var(--warning)'}}/>
                <span style={{color:'var(--warning)',fontWeight:600}}>{differs} difference{differs!==1?'s':''}</span>
              </div>
              <div style={{width:1,height:14,background:'var(--border)'}}/>
              <div className="compare-sum-item">
                <div className="compare-sum-dot" style={{background:'var(--danger)'}}/>
                <span style={{color:'var(--danger)',fontWeight:600}}>{missing} missing clause{missing!==1?'s':''}</span>
              </div>
            </div>

            <div className="card" style={{padding:0,overflow:'hidden'}}>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style={{width:'18%'}}>Clause</th>
                      <th style={{width:'30%'}}>Vendor Agreement</th>
                      <th style={{width:'30%'}}>Company Template</th>
                      <th style={{width:'14%'}}>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {COMPARE_DATA.map((row, i) => (
                      <tr key={i}>
                        <td style={{fontWeight:600,color:'var(--text-primary)'}}>{row.clause}</td>
                        <td style={{color: row.status==='missing' ? 'var(--danger)' : 'var(--text-secondary)'}}>{row.vendor}</td>
                        <td>{row.company}</td>
                        <td><span className={`status-badge ${row.status}`}>{statusLabel[row.status]}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ===========================
    // OBLIGATIONS PAGE
    // ===========================
    function ObligationsPage() {
      const [filter, setFilter] = useState('all');
      const tabs = ['all','Client','Vendor','overdue'];
      const tabLabels = { all:'All', Client:'Client', Vendor:'Vendor', overdue:'Overdue' };

      const filtered = OBLIGATIONS_DATA.filter(o => {
        if (filter === 'all') return true;
        if (filter === 'overdue') return o.status === 'overdue';
        return o.party === filter;
      });

      return (
        <div className="page-content">
          <div className="page-header">
            <div className="page-header-left">
              <div className="page-h1">Obligations Tracker</div>
              <div className="page-subtitle">Extracted from Service Agreement – Acme Technologies.pdf</div>
            </div>
          </div>
          <div className="page-scroll">
            <div className="filter-tabs">
              {tabs.map(t => (
                <button key={t} className={`filter-tab ${filter===t?'active':''}`} onClick={()=>setFilter(t)}>
                  {tabLabels[t]}
                </button>
              ))}
            </div>
            <div className="card" style={{padding:0,overflow:'hidden'}}>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Obligation</th><th>Party</th><th>Deadline</th>
                      <th>Frequency</th><th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map(o => (
                      <tr key={o.id}>
                        <td style={{fontWeight:500,color:'var(--text-primary)'}}>{o.obligation}</td>
                        <td style={{color: o.party==='Client' ? 'var(--accent)' : 'var(--warning)', fontWeight:600}}>{o.party}</td>
                        <td>{o.deadline}</td>
                        <td style={{color:'var(--text-muted)'}}>{o.frequency}</td>
                        <td><span className={`obligation-status ${o.status}`}>{o.status.charAt(0).toUpperCase()+o.status.slice(1)}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ===========================
    // CONTRACTS PAGE
    // ===========================
    function ContractsPage({ setShowUploadModal }) {
      const [search, setSearch] = useState('');

      const filtered = CONTRACTS_DATA.filter(c =>
        c.name.toLowerCase().includes(search.toLowerCase()) ||
        c.type.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="page-content">
          <div className="page-header">
            <div className="page-header-left">
              <div className="page-h1">My Contracts</div>
              <div className="page-subtitle">{CONTRACTS_DATA.length} contracts · {CONTRACTS_DATA.filter(c=>c.status==='analysed').length} analysed</div>
            </div>
            <button className="btn-primary" onClick={() => setShowUploadModal(true)}>
              <Icons.Plus/> Upload Contract
            </button>
          </div>
          <div className="page-scroll">
            <div className="search-bar-wrap">
              <div className="search-input-wrap">
                <span className="search-icon"><Icons.Search/></span>
                <input className="search-input" placeholder="Search contracts…" value={search} onChange={e=>setSearch(e.target.value)}/>
              </div>
            </div>

            <div className="card" style={{padding:0,overflow:'hidden'}}>
              {filtered.length === 0 ? (
                <div style={{padding:40,textAlign:'center',color:'var(--text-muted)'}}>No contracts found.</div>
              ) : (
                filtered.map(c => (
                  <div className="contract-row" key={c.id}>
                    <div className="contract-row-icon"><Icons.Document/></div>
                    <div className="contract-row-info">
                      <div className="contract-row-name">{c.name}</div>
                      <div className="contract-row-meta">{c.type} · {c.uploaded} · {c.pages} pages</div>
                    </div>
                    <div className="contract-row-badges">
                      <span className={`risk-pill ${c.risk}`}>{c.risk.charAt(0).toUpperCase()+c.risk.slice(1)}</span>
                      <span className={`status-pill ${c.status}`}>{c.status.charAt(0).toUpperCase()+c.status.slice(1)}</span>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ===========================
    // APP ROOT
    // ===========================
    function App() {
      const [activePage, setActivePage] = useState('chat');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [showDocModal, setShowDocModal] = useState(false);
      const [showUploadModal, setShowUploadModal] = useState(false);

      const renderPage = () => {
        switch (activePage) {
          case 'chat':        return <ChatPage showDocModal={showDocModal} setShowDocModal={setShowDocModal}/>;
          case 'analysis':    return <AnalysisPage/>;
          case 'compare':     return <ComparePage/>;
          case 'obligations': return <ObligationsPage/>;
          case 'contracts':   return <ContractsPage setShowUploadModal={setShowUploadModal}/>;
          default:            return <ChatPage showDocModal={showDocModal} setShowDocModal={setShowDocModal}/>;
        }
      };

      return (
        <div className="app-layout">
          <Sidebar
            activePage={activePage}
            setActivePage={setActivePage}
            collapsed={sidebarCollapsed}
            setCollapsed={setSidebarCollapsed}
          />

          <div className="main-area">
            {renderPage()}
            {activePage === 'chat' && (
              <InsightsPanel onViewDoc={() => setShowDocModal(true)}/>
            )}
          </div>

          {showDocModal && <DocModal onClose={() => setShowDocModal(false)}/>}
          {showUploadModal && <UploadModal onClose={() => setShowUploadModal(false)}/>}
        </div>
      );
    }

    // ===========================
    // MOUNT
    // ===========================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
